# ===== Lumi 배포용 설정 (SPRING_PROFILES_ACTIVE=prod 일 때 사용) =====
# 비밀값은 전부 환경변수(deploy/.env → docker-compose)로만 받는다. 이 파일에는 키/비밀번호를 쓰지 않는다.
# 로컬 개발용 application.properties 와 같은 순서·구조이며, 이 파일만으로 서버가 완전히 뜨도록 전부 담았다.

spring.application.name=Lumi
server.port=${PORT:8081}

# 한글 깨짐 방지 (응답 본문, 정적 파일, API 응답을 UTF-8로)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# Caddy(리버스 프록시) 뒤에서 https/실제 호스트를 올바르게 인식 — Google 로그인 리디렉션 주소가 https로 만들어지는 데 필요
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# 운영에서 내부 정보가 응답에 새지 않게
server.error.include-message=never
server.error.include-stacktrace=never
spring.h2.console.enabled=false
logging.level.org.springframework.security=INFO

# MySQL (compose 안의 mysql 컨테이너)
spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/lumi_database}
spring.datasource.username=${DB_USERNAME:lumi_app}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 구글 로그인(OAuth2). 리디렉션 URI: https://<도메인>/login/oauth2/code/google
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:}
spring.security.oauth2.client.registration.google.scope=openid,profile,email

# Gemini API
gemini.api.key=${GEMINI_API_KEY:}
gemini.api.base-url=https://generativelanguage.googleapis.com/v1beta/models
gemini.model=gemini-3.5-flash-lite

# JPA: 첫 기동 때 빈 테이블을 자동 생성(update). SQL은 로그에 남기지 않는다(개인정보 보호)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Mustache (로그인/회원가입 화면)
spring.mustache.suffix=.mustache
spring.mustache.prefix=classpath:/templates/
spring.mustache.charset=UTF-8

# Naver 검색 API
naver.api.client-id=${NAVER_CLIENT_ID:}
naver.api.client-secret=${NAVER_CLIENT_SECRET:}

# 감정 분석 서버 (compose 안의 emotion 컨테이너)
emotion.server.base-url=${EMOTION_SERVER_BASE_URL:http://emotion:8002}
emotion.log.retention-days=90

# TTS: Fish Audio
fish.audio.api-key=${FISH_API_KEY:}
fish.audio.model=${FISH_AUDIO_MODEL:s2.1-pro-free}
fish.audio.reference-id=${FISH_AUDIO_REFERENCE_ID:}
# 언어+성별별 목소리 ID (공개 보이스 라이브러리 ID이며 비밀값이 아니다)
fish.audio.reference-id.ko-male=2cbfcfa2071840e880306c5cee12cdb9
fish.audio.reference-id.ko-female=de70a27be2414ab19d8273c4b173bbab
fish.audio.reference-id.en-male=612b878b113047d9a770c069c8b4fdfe
fish.audio.reference-id.en-female=5bbd039a382c483fa5f6a1fed89d0b2c

# 음성 입력(STT): OpenAI 키를 그대로 쓴다
stt.enabled=true
stt.model=${OPENAI_STT_MODEL:gpt-4o-mini-transcribe}
stt.per-minute=20
stt.timeout-seconds=20

youtube.api.key=${YOUTUBE_API_KEY:}
youtube.daily-limit=90
verify.daily-limit-per-user=30
translate.daily-limit-per-user=150

# 세션 보안 (정보보안개론 3장: 유휴 세션 만료)
security.session.idle-minutes=30
security.session.max-hours=12
security.session.bind-ip=false

# 동시 요청 제한 (DoS 방어)
security.concurrency.per-user=2
security.concurrency.global-max=12

# 느린 연결 방어(Slowloris/Slow POST)
server.tomcat.connection-timeout=10s

# IP당 /api 요청 제한 (분당)
security.api-rate-limit.per-minute=300

# 웹 공격 차단
security.web-attack.enabled=true
security.web-attack.strikes=5
security.web-attack.ban-minutes=10

# 쿠키: HTTPS 전용 + JS 접근 불가
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.http-only=true

# Caddy 뒤에서만 X-Forwarded-For 를 믿는다 (Spring 포트를 밖에 열지 않는 구조에서만 true)
security.trusted-proxy.enabled=true

# 모델 장애 시 예비 호출: Gemini가 한도(429)·과부하(503)일 때 다른 모델로 이어서 답한다
llm.fallback.enabled=true
llm.fallback.order=openai,grok
llm.fallback.timeout-seconds=40
llm.openai.api-key=${OPENAI_API_KEY:}
llm.openai.model=${OPENAI_MODEL:gpt-4.1-mini}
llm.grok.api-key=${XAI_API_KEY:}
llm.grok.model=${XAI_MODEL:grok-4.3}

# 로그인 토큰(JWT)
security.jwt.secret=${JWT_SECRET}
security.jwt.access-minutes=15
security.jwt.cookie-secure=true

# 의도 라우터
router.enabled=true
router.min-confidence=0.8
